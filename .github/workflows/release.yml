name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@0cff5e74b3a9b106490723264468271a23d5579d # v0.24.0
    with:
      version: ${{ inputs.version }}

  tag:
    name: Tag
    needs: gate
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@0cff5e74b3a9b106490723264468271a23d5579d # v0.24.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
