name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@7d1fccfcbfa984ab086ba059237ef3b263b0df09 # v0.23.1
    with:
      version: ${{ inputs.version }}

  tag:
    name: Tag
    needs: gate
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@7d1fccfcbfa984ab086ba059237ef3b263b0df09 # v0.23.1
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
