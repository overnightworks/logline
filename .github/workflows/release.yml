name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@34c82adba7820c036634b18ed01486da78e00c73 # v0.23.0
    with:
      version: ${{ inputs.version }}

  tag:
    name: Tag
    needs: gate
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@34c82adba7820c036634b18ed01486da78e00c73 # v0.23.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
