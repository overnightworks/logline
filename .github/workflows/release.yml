name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@505b0df999b4bab932aba53f3e3dea044066debe # v0.18.0
    with:
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build the distribution
        run: uv build --wheel --build-constraint .github/requirements-build.txt --require-hashes

      - name: Refuse unless the build holds exactly the wheel at the version
        run: |
          expected="overnightworks_logline-${VERSION}-py3-none-any.whl"
          built=""
          if [ -d dist ]; then
            built=$(LC_ALL=C ls dist | paste -sd, -)
          fi
          if [ "$built" != "$expected" ]; then
            echo "Refused: the build must hold exactly $expected, but dist holds ${built:-nothing}." >&2
            exit 1
          fi

      - name: Write the notes that pin the built wheel by its hash
        id: notes
        working-directory: dist
        run: |
          wheel="overnightworks_logline-${VERSION}-py3-none-any.whl"
          sha256sum "$wheel" >"$wheel.sha256"
          wheel_sha256=$(cut -d' ' -f1 "$wheel.sha256")
          {
            echo 'notes<<NOTES'
            echo 'The wheel, pinned by URL and sha256:'
            echo
            echo '```'
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/$wheel#sha256=$wheel_sha256"
            echo '```'
            echo 'NOTES'
          } >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  tag:
    name: Tag
    needs: [gate, build]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@505b0df999b4bab932aba53f3e3dea044066debe # v0.18.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      artifact: release-files
      notes: ${{ needs.build.outputs.notes }}
