[project]
name = "overnightworks-logline"
dynamic = ["version"]
description = "The fleet's shared Python logger: one JSON record shape on stdout, a request line and W3C trace context"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
keywords = ["logging", "structlog", "json", "asgi", "opentelemetry", "traceparent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "structlog>=25.1",
    "opentelemetry-api>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3.7,<4",
    "pytest-randomly>=4,<6",
    "fastapi>=0.123.7,<1",
    "uvicorn>=0.41,<1",
    "websockets>=15,<18",
    "wsproto>=1.2,<2",
    "httpx>=0.27,<1",
    "httpx2>=2,<3",
    "urllib3>=2.0,<3",
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "ruff>=0.4,<1",
    "pyright>=1.1.414,<2",
    "deptry==0.25.1",
    "httptools>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/overnightworks/logline"
Issues = "https://github.com/overnightworks/logline/issues"
Releases = "https://github.com/overnightworks/logline/releases"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "logline.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["logline*"]

[tool.setuptools.package-data]
logline = ["standard.json"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.deptry.per_rule_ignores]
# `logline.outgoing_trace` patches httpx, httpx2 and websockets only where the host installed them.
DEP004 = ["httpx", "httpx2", "websockets"]

[tool.pyright]
include = [
    "src/logline",
    "tests",
]
pythonVersion = "3.14"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/logline/__init__.py" }]
