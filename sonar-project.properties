sonar.organization=overnightworks
sonar.projectKey=overnightworks_logline
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# The workflow installs logline itself from its own checkout: a PEP 660 build by the setuptools backend
# that `--no-build` forbids, while every dependency is a wheel in uv.lock. lowest-direct resolves the
# direct dependencies to their declared floors on purpose, so it has no lock.
sonar.issue.ignore.multicriteria=ciBuildsTheProject,ciResolvesFloors
sonar.issue.ignore.multicriteria.ciBuildsTheProject.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.ciBuildsTheProject.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.ciResolvesFloors.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.ciResolvesFloors.resourceKey=.github/workflows/ci.yml
